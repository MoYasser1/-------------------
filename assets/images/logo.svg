  <path d="M32 4 L56 12 V32 C56 46.5 45.8 57.5 32 61 C18.2 57.5 8 46.5 8 32 V12 L32 4 Z" 
        stroke="#C6A664" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#4A1525" fill-opacity="0.08"/>
  
  <!-- Balance Pillar -->
  <line x1="32" y1="16" x2="32" y2="48" stroke="#C6A664" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Balance Beam -->
  <path d="M18 24 L32 21 L46 24" stroke="#C6A664" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left Scale Pan -->
  <line x1="18" y1="24" x2="14" y2="34" stroke="#C6A664" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="18" y1="24" x2="22" y2="34" stroke="#C6A664" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M12 34 Q18 39 24 34 Z" fill="#C6A664" fill-opacity="0.3" stroke="#C6A664" stroke-width="1.5"/>
  
  <!-- Right Scale Pan -->
  <line x1="46" y1="24" x2="42" y2="34" stroke="#C6A664" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="46" y1="24" x2="50" y2="34" stroke="#C6A664" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M40 34 Q46 39 52 34 Z" fill="#C6A664" fill-opacity="0.3" stroke="#C6A664" stroke-width="1.5"/>
  
  <!-- Pedestal -->
  <line x1="22" y1="48" x2="42" y2="48" stroke="#C6A664" stroke-width="2.5" stroke-linecap="round"/>
</svg>
